{% extends "base.html" %}

{% block title %}Login — WasteVision{% endblock %}

{% block content %}

<section class="form-card">

    <h1>Login</h1>

    {% if error %}
        <div class="error">
            {{ error }}
        </div>
    {% endif %}

    <form method="post" action="/login">

        <label for="email">Email</label>

        <input
            id="email"
            type="email"
            name="email"
            value="{{ email | default('') }}"
            required
        >

        <label for="password">Password</label>

        <input
            id="password"
            type="password"
            name="password"
            required
        >

        <button type="submit" class="button">
            Login
        </button>

    </form>

    <p>
        Don't have an account?
        <a href="/register">Register</a>
    </p>

</section>

{% endblock %}
